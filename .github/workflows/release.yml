# Release — release-please automation + GHCR container publish.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver without leading v), e.g. 0.1.1"
        required: true
        type: string
      source_sha:
        description: "Source commit SHA to release (defaults to the checked-out SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Recovery/bootstrap release path. Only runs on workflow_dispatch.
  bootstrap-release:
    name: Bootstrap release (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
      release_sha: ${{ steps.sha.outputs.sha }}
      release_created: ${{ steps.done.outputs.created }}
    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Resolve source SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.source_sha }}" ]; then
            sha="${{ inputs.source_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          # validate full sha
          if ! [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::invalid source SHA: $sha"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid version: $v"; exit 1
          fi
          # ensure tag does not already exist
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "::error::tag v$v already exists"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$v" | grep -q .; then
            echo "::error::remote tag v$v already exists"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Sync version metadata
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Update Cargo.toml version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          # Update manifest
          python3 - "$VERSION" <<'PY'
import json,sys
v=sys.argv[1]
p='.release-please-manifest.json'
d=json.load(open(p))
d['.']=v
open(p,'w').write(json.dumps(d,indent=2)+'\n')
PY
          cargo update -p kilo-provider 2>/dev/null || true

      - name: Verify tag not existing & create tag
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true

      - name: Mark done
        id: done
        run: echo "created=true" >> "$GITHUB_OUTPUT"

  release-please:
    name: Release Please (manifest mode)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-ghcr:
    name: Publish image to GHCR
    needs: [release-please, bootstrap-release]
    if: >-
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true' && contains(fromJSON(needs.release-please.outputs.paths_released || '[]'), '.')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine release params
        id: params
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ needs.bootstrap-release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.bootstrap-release.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ needs.bootstrap-release.outputs.release_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.release-please.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ needs.release-please.outputs.release_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release tag
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.params.outputs.tag_name }}
          persist-credentials: false

      - name: Validate image refs
        id: validate
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.params.outputs.version }}
          RELEASE_SHA: ${{ steps.checkout.outputs.commit }}
          CHECKED_SHA: ${{ steps.params.outputs.sha }}
        run: |
          set -euo pipefail
          repo="${REPOSITORY#*/}"
          image="ghcr.io/${REPOSITORY_OWNER,,}/${repo,,}"
          # ensure lowercase
          if [ "$image" != "$(echo "$image" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::image ref not lowercase"; exit 1
          fi
          # tags from metadata
          version="${RELEASE_VERSION#v}"
          # validate checked out sha equals params sha
          if [ "$RELEASE_SHA" != "$CHECKED_SHA" ]; then
            echo "::error::checked-out SHA $RELEASE_SHA != release SHA $CHECKED_SHA"; exit 1
          fi
          # build tag list
          NL=$'\n'
          tags="$image:$version"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            if [ "$major" -ne 0 ]; then
              tags="${tags}${NL}$image:${major}.${minor}${NL}$image:${major}"
            fi
            tags="${tags}${NL}$image:latest"
          fi
          tags="${tags}${NL}$image:sha-${RELEASE_SHA:0:7}"
          # validate each tag
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            if [[ "$ref" != ghcr.io/* ]]; then
              echo "::error::tag not GHCR: $ref"; exit 1
            fi
            if [[ "$ref" == docker.io/* ]]; then
              echo "::error::tag points to Docker Hub: $ref"; exit 1
            fi
            # extract tag part after last colon for validation
            tagpart="${ref##*:}"
            if [ -z "$tagpart" ]; then
              echo "::error::empty tag"; exit 1
            fi
            if [[ "$tagpart" =~ [^a-zA-Z0-9._-] ]]; then
              echo "::error::invalid tag chars: $tagpart"; exit 1
            fi
          done <<< "$tags"
          # verify no bare tags
          if echo "$tags" | grep -qE '^(0|[0-9]+\.[0-9]+\.[0-9]+|latest|sha-[a-f0-9]+)$'; then
            : # bare names are okay as suffixes only; full ref has image prefix
          fi
          {
            echo "image=$image"
            echo "commit=$RELEASE_SHA"
            echo "version=$version"
            echo "tags<<GHA_TAGS_EOF"
            echo "$tags"
            echo "GHA_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.validate.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.validate.outputs.commit }}
            org.opencontainers.image.version=${{ steps.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write publish summary
        run: |
          {
            echo '## Container image published'
            echo ''
            echo "- image: \`${{ steps.validate.outputs.image }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- version: \`${{ steps.validate.outputs.version }}\`"
            echo "- revision: \`${{ steps.validate.outputs.commit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
