# Release — release-please automation + GHCR container publish.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver without leading v), e.g. 0.1.1"
        required: true
        type: string
      source_sha:
        description: "Source commit SHA to release (full 40-character SHA; defaults to the checked-out SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Recovery/bootstrap release path. Only runs on workflow_dispatch.
  bootstrap-release:
    name: Bootstrap release (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version }}
      release_sha: ${{ steps.commit.outputs.sha }}
      release_created: ${{ steps.done.outputs.created }}
    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0

      - name: Resolve source SHA
        id: sha
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SOURCE_SHA:-}" ]; then
            sha="${INPUT_SOURCE_SHA}"
          else
            sha="${GITHUB_SHA}"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source SHA must be a full 40-character lowercase hex SHA: $sha"; exit 1
          fi
          # Verify the selected source SHA is reachable in this checkout.
          if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "::error::source SHA not found in repository: $sha"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${INPUT_VERSION}"
          v="${v#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid version: $v"; exit 1
          fi
          if [ "$v" = "0.1.0" ]; then
            echo "::error::v0.1.0 must never be moved, deleted or overwritten"; exit 1
          fi
          # ensure tag does not already exist locally or remotely
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "::error::tag v$v already exists locally"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$v" | grep -q .; then
            echo "::error::remote tag v$v already exists"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Checkout selected source SHA
        id: checkout-sha
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          echo "checked_out=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync version metadata
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # Update Cargo.toml version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          # Update manifest using environment variable (never interpolate into source).
          python3 -c 'import json,os; v=os.environ["VERSION"]; p=".release-please-manifest.json"; d=json.load(open(p)); d["."]=v; open(p,"w").write(json.dumps(d,indent=2)+"\n")'
          # Keep Cargo.lock in sync with the crate version.
          cargo update -p kilo-provider --offline 2>/dev/null || cargo update -p kilo-provider 2>/dev/null || true

      - name: Validate release metadata
        id: validate-metadata
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_SHA: ${{ steps.sha.outputs.sha }}
          CHECKED_SHA: ${{ steps.checkout-sha.outputs.checked_out }}
          TAG_NAME: v${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION" \
          SOURCE_SHA="$SOURCE_SHA" \
          CHECKED_SHA="$CHECKED_SHA" \
          TAG_NAME="$TAG_NAME" \
          bash scripts/validate-release-metadata.sh

      - name: Commit metadata changes if needed
        id: commit
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock .release-please-manifest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: release v${VERSION} metadata"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git tag "$tag" "$RELEASE_SHA"
          git push origin "$tag"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          generate_release_notes: true

      - name: Mark done
        id: done
        run: echo "created=true" >> "$GITHUB_OUTPUT"

  release-please:
    name: Release Please (manifest mode)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-ghcr:
    name: Publish image to GHCR
    needs: [release-please, bootstrap-release]
    # NOTE: `always()` is required here, not just the event/output checks.
    # This job needs both the push-only `release-please` job and the
    # workflow_dispatch-only `bootstrap-release` job, so exactly one of them is
    # always skipped. GitHub Actions skips a job whose `needs` contains a
    # skipped job unless its `if` explicitly opts out with `always()` /
    # `!cancelled()`. Without `always()`, a successful release-please run still
    # skipped this job and no image was ever published (v0.2.0, v0.3.0).
    # The explicit `result`/output checks below keep the opt-out safe: nothing
    # is published unless the job that actually performs the release succeeded.
    if: >-
      always() && (
      (github.event_name == 'push' &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.release_created == 'true' &&
      contains(fromJSON(needs.release-please.outputs.paths_released || '[]'), '.')) ||
      (github.event_name == 'workflow_dispatch' &&
      needs.bootstrap-release.result == 'success' &&
      needs.bootstrap-release.outputs.release_created == 'true' &&
      needs.bootstrap-release.outputs.tag_name != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Determine release params
        id: params
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BOOTSTRAP_TAG: ${{ needs.bootstrap-release.outputs.tag_name }}
          BOOTSTRAP_VERSION: ${{ needs.bootstrap-release.outputs.version }}
          BOOTSTRAP_SHA: ${{ needs.bootstrap-release.outputs.release_sha }}
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_PLEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_PLEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag_name="${BOOTSTRAP_TAG}"
            version="${BOOTSTRAP_VERSION}"
            sha="${BOOTSTRAP_SHA}"
          else
            tag_name="${RELEASE_PLEASE_TAG}"
            version="${RELEASE_PLEASE_VERSION}"
            sha="${RELEASE_PLEASE_SHA}"
          fi
          # Fail fast with an actionable error instead of checking out an empty
          # ref / validating empty metadata later.
          if [ -z "$tag_name" ] || [ -z "$version" ] || [ -z "$sha" ]; then
            echo "::error::missing release params (tag='${tag_name}' version='${version}' sha='${sha}')"
            exit 1
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.params.outputs.tag_name }}
          persist-credentials: false

      - name: Validate release metadata
        id: validate-metadata
        shell: bash
        env:
          VERSION: ${{ steps.params.outputs.version }}
          SOURCE_SHA: ${{ steps.params.outputs.sha }}
          CHECKED_SHA: ${{ steps.checkout.outputs.commit }}
          TAG_NAME: ${{ steps.params.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$VERSION" \
          SOURCE_SHA="$SOURCE_SHA" \
          CHECKED_SHA="$CHECKED_SHA" \
          TAG_NAME="$TAG_NAME" \
          bash scripts/validate-release-metadata.sh

      - name: Validate image refs
        id: validate
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.params.outputs.version }}
          RELEASE_SHA: ${{ steps.checkout.outputs.commit }}
          CHECKED_SHA: ${{ steps.params.outputs.sha }}
          TAGS_OUTPUT: ""
        run: |
          set -euo pipefail
          repo="${REPOSITORY#*/}"
          image="ghcr.io/${REPOSITORY_OWNER,,}/${repo,,}"
          if [ "$image" != "$(echo "$image" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::image ref not lowercase"; exit 1
          fi
          version="${RELEASE_VERSION#v}"
          if [ "$RELEASE_SHA" != "$CHECKED_SHA" ]; then
            echo "::error::checked-out SHA $RELEASE_SHA != release SHA $CHECKED_SHA"; exit 1
          fi
          NL=$'\n'
          tags="$image:$version"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            if [ "$major" -ne 0 ]; then
              tags="${tags}${NL}$image:${major}.${minor}${NL}$image:${major}"
            fi
            tags="${tags}${NL}$image:latest"
          fi
          tags="${tags}${NL}$image:sha-${RELEASE_SHA:0:7}"
          # Validate each fully qualified GHCR tag.
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            if [[ "$ref" != ghcr.io/* ]]; then
              echo "::error::tag not fully qualified GHCR ref: $ref"; exit 1
            fi
            if [[ "$ref" == docker.io/* ]]; then
              echo "::error::tag points to Docker Hub: $ref"; exit 1
            fi
            tagpart="${ref##*:}"
            if [ -z "$tagpart" ]; then
              echo "::error::empty tag: $ref"; exit 1
            fi
            if [[ "$tagpart" =~ [^a-zA-Z0-9._-] ]]; then
              echo "::error::invalid tag chars: $tagpart"; exit 1
            fi
          done <<< "$tags"
          # Validate tag uniqueness.
          if [ -n "$(printf '%s\n' $tags | sort | uniq -d)" ]; then
            echo "::error::duplicate GHCR tags generated"; exit 1
          fi
          {
            echo "image=$image"
            echo "commit=$RELEASE_SHA"
            echo "version=$version"
            echo "tags<<GHA_TAGS_EOF"
            echo "$tags"
            echo "GHA_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.validate.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.validate.outputs.commit }}
            org.opencontainers.image.version=${{ steps.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write publish summary
        run: |
          {
            echo '## Container image published'
            echo ''
            echo "- image: \`${{ steps.validate.outputs.image }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- version: \`${{ steps.validate.outputs.version }}\`"
            echo "- revision: \`${{ steps.validate.outputs.commit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"